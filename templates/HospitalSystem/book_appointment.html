{% extends 'HospitalSystem/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Book Appointment</h2>
    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-success">Book Appointment</button>
                <a href="{% url 'patient_dashboard' %}" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
