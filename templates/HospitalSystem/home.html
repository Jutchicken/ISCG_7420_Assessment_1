{% extends "HospitalSystem/Base.html" %}
{% block title %}
    Home
{% endblock %}
{% block content %}
    <h1>Home</h1>
    {% if user.is_authenticated %}
        <p>Hello {{ user.username }}</p>
        <p>Group: {{  user.groups.all|join:"," }}</p>
        <form method="post" action="{% url 'home' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <p>You are not logged in</p>
    {% endif %}
{% endblock %}
