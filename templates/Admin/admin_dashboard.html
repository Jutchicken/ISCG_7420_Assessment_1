{% extends 'HospitalSystem/Base.html' %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Admin Dashboard</h1>
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Doctors</h5>
                    <h2>{{ doctor_count }}</h2>
                    <a href="{% url 'admin_doctor_list' %}" class="btn btn-primary">Manage Doctors</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Patients</h5>
                    <h2>{{ patient_count }}</h2>
                    <a href="{% url 'admin_patient_list' %}" class="btn btn-primary">Manage Patients</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Departments</h5>
                    <h2>{{ department_count }}</h2>
                    <a href="{% url 'admin_department_list' %}" class="btn btn-primary">Manage Departments</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Appointments</h5>
                    <h2>{{ appointment_count }}</h2>
                    <a href="{% url 'admin_appointment_list' %}" class="btn btn-primary">Manage Appointments</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
