{% extends 'HospitalSystem/Base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>Manage Departments</h2>
        <a href="{% url 'admin_department_add' %}" class="btn btn-success">+ Add Department</a>
    </div>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for department in departments %}
            <tr>
                <td>{{ department.name }}</td>
                <td>
                    <a href="{% url 'admin_department_edit' department.id %}" class="btn btn-warning btn-sm">
                        Edit
                    </a>
                    <form method="POST" action="{% url 'admin_department_delete' department.id %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this department?')">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">No departments found.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
